services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:v2.1.2-ls226
    container_name: syncthing
    restart: unless-stopped
    hostname: thriller-bark
    environment:
      PUID: "1000"
      PGID: "1000"
    ports:
      - "0.0.0.0:22000:22000/tcp"    # BEP sync — the deliberate exception
      - "0.0.0.0:22000:22000/udp"    # QUIC
      - "127.0.0.1:8384:8384"        # GUI/API, for host-mode Alloy to scrape /metrics — same pattern as litellm
    networks:
      - edge                         # GUI reached by Caddy over container DNS, no host publish
    volumes:
      - syncthing-config:/config
      - syncthing-data:/data

networks:
  edge:
    external: true

volumes:
  syncthing-config:
  syncthing-data:
