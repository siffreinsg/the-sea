# TB-only: bind to the private NIC IP, not the public 141.253.109.196 — OCI NATs
# the public IP to this private one before it reaches the OS, so binding the public
# address means nothing ever arrives (connection refused). Port stays 22, the
# documented open port (docs/REFERENCE.md).
AddressFamily inet
ListenAddress 10.0.0.112
AllowUsers ubuntu
