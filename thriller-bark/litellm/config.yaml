# LiteLLM gateway. The model list stays here, in git — STORE_MODEL_IN_DB is left at its
# default so the Admin UI's model pages are read-only and this file is the source of truth.
# The database exists for virtual keys, budgets and spend logs, not for models.
#
# Don't "tidy" the `model:` prefixes below — they are deliberately not consistent across
# models. Each entry is a known-working shape; see the api_base note under credential_list
# for why the difference matters.

# One credential, referenced by every model. This is what supplies api_base — without it
# the `openai/...` and `custom_llm_provider: openai` entries below would dial
# api.openai.com with a Scaleway key.
credential_list:
  - credential_name: scaleway
    credential_values:
      api_key: os.environ/SCW_SECRET_KEY
      api_base: https://api.scaleway.ai/v1
    credential_info:
      description: Scaleway Personal account

  # Free tier. **Assume everything sent here is used for training** — that is the price of
  # the free plan, and it is why only mechanical task calls route to this credential and
  # never a user's chat or a RAG-retrieved document. See the `free-*` models below.
  - credential_name: mistral
    credential_values:
      api_key: os.environ/MISTRAL_API_KEY
    credential_info:
      description: Mistral La Plateforme, free tier

model_list:
  # --- chat ---------------------------------------------------------------------------
  # Cheap and fast. This is also Open-WebUI's TASK_MODEL_EXTERNAL.
  - model_name: scw-qwen3.6-35b
    litellm_params:
      model: scaleway/qwen/qwen3.6-35b-a3b
      litellm_credential_name: scaleway
      allowed_openai_params:
        - reasoning_effort
      reasoning_effort: "low"
      tpm: 2000000
      rpm: 600
      drop_params: true
    model_info:
      mode: chat
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 1.5e-6
      max_input_tokens: 256000
      max_output_tokens: 32000
      max_tokens: 32000
      supports_vision: true
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_response_schema: true
      supports_prompt_caching: false
      supports_reasoning: true

  # The task model: title generation, tags, search-query generation. Non-reasoning on
  # purpose — a reasoning model burns hundreds of thinking tokens to produce a six-word
  # chat title. At EUR 0.35/M output it is ~4x cheaper than qwen3.6 on the metric that
  # matters here, and these calls are almost pure output.
  - model_name: scw-mistral-small-3.2-24b
    litellm_params:
      model: mistral-small-3.2-24b-instruct-2506
      litellm_credential_name: scaleway
      custom_llm_provider: openai
      tpm: 2000000
      rpm: 600
    model_info:
      mode: chat
      input_cost_per_token: 0.15e-6
      output_cost_per_token: 0.35e-6
      max_input_tokens: 128000
      max_output_tokens: 32000
      max_tokens: 32000
      supports_vision: true
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_response_schema: true
      supports_prompt_caching: false

  - model_name: scw-qwen3.5-397b-a17b
    litellm_params:
      model: scaleway/qwen/qwen3.5-397b-a17b
      litellm_credential_name: scaleway
      reasoning_effort: "high"
      allowed_openai_params:
        - reasoning_effort
      tpm: 2000000
      rpm: 600
      drop_params: true
    model_info:
      mode: chat
      input_cost_per_token: 6.0e-7
      output_cost_per_token: 3.6e-6
      max_input_tokens: 250000
      max_output_tokens: 16000
      max_tokens: 16000
      supports_vision: true
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_response_schema: true
      supports_prompt_caching: false
      supports_reasoning: true

  # No `scaleway/` prefix on this one, and that is deliberate.
  - model_name: scw-glm-5.2
    litellm_params:
      model: glm-5.2
      litellm_credential_name: scaleway
      custom_llm_provider: openai
      reasoning_effort: "high"
      allowed_openai_params:
        - reasoning_effort
      tpm: 1000000
      rpm: 600
      drop_params: true
    model_info:
      mode: chat
      input_cost_per_token: 1.80e-6
      output_cost_per_token: 5.50e-6
      max_input_tokens: 256000
      max_output_tokens: 16000
      max_tokens: 256000
      supports_vision: false
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_response_schema: true
      supports_prompt_caching: false
      supports_reasoning: true

  # --- free tier: mechanical calls only -------------------------------------------------
  # Open-WebUI's TASK_MODEL_EXTERNAL points at `task-cheap`, not at a model directly. That
  # indirection is the whole design: `task-cheap` resolves to Mistral's free tier first and
  # falls back to the paid Scaleway deployment when the free quota is exhausted — see
  # `router_settings.fallbacks`.
  #
  # **Nothing sensitive routes here.** Title, tag and retrieval-query generation only. Note
  # honestly that title generation still sees the user's first message, so this is a bounded
  # trade, not zero exposure. Main chat never falls back to a free tier.
  #
  # **No rpm/tpm on purpose.** Mistral's free tier is not a fixed quota — the limit moves
  # with global platform load, day to day. A static cap would either never trigger or
  # throw away free capacity you actually had, so the 429 itself is the signal instead:
  # `router_settings.retry_policy` fails the call over to Scaleway rather than retrying a
  # limit that someone else's traffic is setting.
  #
  # Note this group has a single deployment, and cooldown_handlers.py:178 skips cooldown
  # entirely for single-deployment groups — so `allowed_fails`/`cooldown_time` do NOT
  # apply here. Fallback on error is the whole mechanism, which is why the retry policy
  # below matters more than it looks.
  - model_name: task-cheap
    litellm_params:
      model: mistral/mistral-small-latest
      litellm_credential_name: mistral
    model_info:
      mode: chat
      # Free. Recorded as zero so the spend dashboard shows the saving rather than hiding it.
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_input_tokens: 128000
      max_output_tokens: 8000
      supports_function_calling: true
      supports_prompt_caching: false

  # The paid fallback is the existing `scw-mistral-small-3.2-24b` entry above, reached via
  # router_settings.fallbacks — deliberately NOT a second deployment inside this group.
  # A model group with two deployments load-balances across them, which would send half
  # the task calls to Scaleway while free quota was still available. One deployment plus a
  # fallback is what actually means "free first, paid only when the quota is spent".

  # No reranking model: retrieval is cosine + BM25 only
  # ([why](../../docs/ADR/2026-07-28-no-reranking.md)).

  # --- audio --------------------------------------------------------------------------
  # Whisper, not voxtral: this is the /v1/audio/transcriptions model, which is what
  # Open-WebUI's STT calls. Voxtral is a chat model that accepts audio — not a drop-in.
  - model_name: scw-whisper-large-v3
    litellm_params:
      model: openai/whisper-large-v3
      litellm_credential_name: scaleway
      # No response_format override: Open-WebUI's STT client reads `.text` off a JSON
      # body, which is the default. Forcing text would hand it a bare string.
      rpm: 600
    model_info:
      mode: audio_transcription
      input_cost_per_second: 0.003
      output_cost_per_second: 0
      supported_endpoints:
        - "/v1/audio/transcriptions"
      supports_audio_input: true
      supports_prompt_caching: false

  # --- embeddings ---------------------------------------------------------------------
  # bge over qwen3-embedding-8b. Not a quality call: bge is a **fixed 3584 dimensions**,
  # where qwen is configurable 32–4096. Phase 4 has to set
  # PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH=3584 to match, *before the first document is
  # indexed* — changing it later means dropping the index and re-embedding the whole
  # corpus at Scaleway's per-token rate. A fixed number removes that mistake. bge also
  # tops MTEB for French. The cost is an 8k context vs qwen's 32k, which RAG chunks of
  # ~1k tokens never approach, and a lower 400k tpm ceiling.
  # If you ever switch to qwen, pin `dimensions:` explicitly in the same commit as the
  # pgvector var — never leave it to the default.
  - model_name: scw-bge-multilingual-gemma2
    litellm_params:
      model: openai/bge-multilingual-gemma2
      encoding_format: "float"
      litellm_credential_name: scaleway
      tpm: 400000
      rpm: 600
    model_info:
      mode: embedding
      input_cost_per_token: 0.10e-6
      output_cost_per_token: 0.0
      max_input_tokens: 8192
      supports_prompt_caching: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

  # Defaults to "all". The literal is `admin_only` — verified at
  # sso_helper_utils.py:9, which compares `== "admin_only"`. Do not trust the
  # `Literal["admin", "all"]` annotation at proxy_server.py:1939; it is stale, and "admin"
  # would silently fall through to permissive.
  #
  # **Currently inert, on purpose.** Enforcement lives in the SSO login path
  # (ui_sso.py:3155), and this proxy's UI is entered with UI_USERNAME/UI_PASSWORD, not SSO.
  # Set now so that wiring the UI to Authelia later does not also need this remembered —
  # the default would otherwise let any virtual-key holder into the admin UI, spend and
  # model config included, on a publicly-resolvable hostname.
  ui_access_mode: admin_only
  # allowed_routes left unset on purpose: every consumer is ours, and pinning the list
  # makes each new endpoint fail as a confusing 404 in a lab that is actively changing.

  # A user pressing "stop" in Open-WebUI abandons the stream, but without this the proxy
  # keeps consuming the whole generation upstream — tokens billed and nobody reads them.
  cancel_on_disconnect: true
  # Ceilings, not tuning. Nothing legitimate here approaches 20 MB.
  max_request_size_mb: 20
  max_response_size_mb: 20
  # TB is 4 vCPU. Headroom above this is for parallel RAG embedding batches, which is the
  # one workload that legitimately fans out.
  global_max_parallel_requests: 40

  # /health then reflects real upstream state instead of only checking when asked, so
  # Prometheus sees a model go bad before a user does.
  background_health_checks: true
  health_check_interval: 300

  # Postgres is shared with Open-WebUI (pool 10 + 5 overflow). Sized so the two consumers
  # do not compete for backends on a box where each connection is a forked process.
  database_connection_pool_limit: 20
  # No `database_url:` here — the proxy reads DATABASE_URL from the environment already,
  # and the entrypoint's prisma migration uses that same variable.

  # --- conversation archive -------------------------------------------------------------
  # Full prompt and response per call, joined to model, cost, latency and virtual key.
  # This is the durable copy; Tempo holds the recent 14d working set (LiteLLM already puts
  # message content in its otel spans, `turn_off_message_logging` defaults False).
  #
  # **This table now holds every conversation in the clear.** It is in TB's *critical*
  # Backrest plan, which is correct, and it is one more reason the DB has no published
  # port.
  store_prompts_in_spend_logs: true

  # Populates `end_user` on spend logs *and* on the Prometheus metrics, which is why the
  # dashboard showed end_user="None": the X-OpenWebUI-* headers were arriving, but nothing
  # told LiteLLM which one identifies the caller. `extra_spend_tag_headers` below only
  # records them as tags; this is the one that sets identity.
  # Email over Id: it is what you want to read on a dashboard, and there is one user.
  user_header_name: X-OpenWebUI-User-Email

  # 6 months, pruned daily by the proxy itself — no cron, no prune script.
  maximum_spend_logs_retention_period: "180d"
  maximum_spend_logs_retention_interval: "1d"
  # Partition by date so the daily prune drops partitions instead of DELETEing rows.
  # Enable it now: it is a schema change, and the table is nearly empty today. Turning it
  # on after six months of conversations is a migration nobody wants to run.
  use_spend_logs_partitioning: true

litellm_settings:
  drop_params: true
  # Traces to Alloy on the host, which relays to Tempo on GM. The OTEL_* endpoint and
  # exporter live in compose.yaml — non-secret, so not in the sops file.
  #
  # This also parents correctly: LiteLLM resolves an inbound `traceparent` header before
  # starting its own root span, so a call from n8n or Open-WebUI joins their trace rather
  # than opening a second one.
  callbacks: ["otel", "prometheus"]
  # `prometheus` mounts /metrics on the proxy — spend, tokens, latency and failures
  # labelled by model and virtual key. Not an enterprise feature at v1.93.0.
  #
  # Auth off, because the alternative is a virtual key inside config.alloy, which is
  # committed in plaintext. /metrics is only bound to 127.0.0.1 and the mesh, and Caddy
  # 404s the path — so this is the same posture VictoriaMetrics and Loki already have,
  # not a new exception. **If the Caddy block is ever removed, this leaks spend, key
  # aliases and model names to the public internet.**
  require_auth_for_metrics_endpoint: false
  extra_spend_tag_headers:
    - x-openwebui-user-name
    - x-openwebui-user-id
    - x-openwebui-user-email
    - x-openwebui-user-role

  # Structured stdout, so Loki queries by field instead of grepping text. Alloy already
  # ships this container's logs; nothing else to wire.
  json_logs: true
  # redact_user_api_key_info stays False: per-key attribution is the entire point of the
  # virtual-key layer, and /metrics exposes key aliases anyway.
  # turn_off_message_logging stays False: the conversation archive depends on it.

  # Guardrails against a runaway loop, not forecasts — total spend to date is €0.00006.
  # Per-key budgets live on the virtual keys themselves (Open-WebUI €30, n8n €10,
  # Karakeep €5 / 30d) so one runaway consumer cannot drain the others; this is the
  # backstop across all of them.
  max_budget: 50
  budget_duration: 30d

  # Embeddings only, in-memory. Re-embedding an identical chunk is pure waste, and
  # re-indexing is on the table while chunking is still being benchmarked.
  # Deliberately NOT chat completions: identical prompts returning identical answers is
  # wrong for a chat UI, where a retry means "give me something different".
  # `local` because Redis was scoped out — note this cache is per-replica and stops
  # helping the moment the proxy is scaled out. That limitation is the point to remember
  # when this design moves to the company build.
  cache: true
  cache_params:
    type: local
    supported_call_types: ["embedding", "aembedding"]

router_settings:
  # Bound failures rather than degrade quality silently. A hung upstream must not tie up a
  # worker forever, and a persistently failing model should leave rotation instead of being
  # retried on every request.
  request_timeout: 120
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 60

  # A 429 means "this quota is spent right now", which retrying rarely fixes — and on
  # Mistral's free tier the limit is set by other people's traffic, so hammering it is
  # pure latency. One retry, then fall over. Everything else keeps the default.
  # This is global, so a Scaleway 429 also gets one retry and then surfaces as an error
  # rather than being retried into the ground — consistent with having no chat fallbacks.
  retry_policy:
    RateLimitErrorRetries: 1

  # **The only fallbacks here are free-tier quota fallbacks.** User-facing chat has none on
  # purpose: a Scaleway incident on qwen3.6 surfaces as a visible error, not as a silently
  # different and weaker answer. `task-cheap` is the exception because both entries in the
  # group are the same model family and the fallback is triggered by an exhausted free
  # quota, not by a quality judgement.
  fallbacks:
    - task-cheap: ["scw-mistral-small-3.2-24b"]
