services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    container_name: litellm
    restart: unless-stopped
    command: ["--config=/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      # Tracing. Paired with `callbacks: ["otel"]` in config.yaml — both are required.
      # otlp_http, so the endpoint carries the full /v1/traces path; the gRPC exporter
      # would want a bare host:port instead.
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://host.docker.internal:4318/v1/traces
      OTEL_SERVICE_NAME: litellm
    extra_hosts:
      # The host, named stably. Bridge gateway IPs move when a network is recreated.
      - "host.docker.internal:host-gateway"
    ports:
      # 127.0.0.1 only. TB's own consumers dial it here; cross-node consumers go through
      # Caddy -> ai.siffreinsigy.me like anything else, so the mesh guard can eventually
      # be fleet-wide. See docs/decisions/2026-07-27-cross-node-calls-use-the-public-edge.md
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - default
      - the-sea-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health/liveliness || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # LiteLLM's own database and nothing else's: virtual keys and the spend log. One database
  # per app ([why](../../docs/ADR/2026-07-28-one-database-per-app.md)), so this is off
  # `the-sea-internal` — the only consumer is `litellm`, on this stack's default network.
  # No `ports:`, so the bind rule is satisfied by having no host port at all.
  #
  # The pgvector image is historical — nothing here stores vectors, Open-WebUI's store is
  # in its own stack now. Left as-is deliberately: swapping to a plain postgres image means
  # a glibc-to-musl move on an already-initialised data directory, which changes collation.
  # A smaller pull is not worth a dump and restore.
  #
  # The volume keeps the `litellm_postgres-data` name from when this service was called
  # `postgres`. Renaming it would mean a dump and restore for cosmetics.
  litellm-db:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: litellm-db
    restart: unless-stopped
    # One .env for both services, so this container also sees LITELLM_SALT_KEY and the
    # Scaleway key. Deliberate — a second secrets file to keep in sync is worse than a
    # few unused variables in an environment nothing reads them from.
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:

networks:
  the-sea-internal:
    external: true
