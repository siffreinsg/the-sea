services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    container_name: litellm
    restart: unless-stopped
    command: ["--config=/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      # Tracing. Paired with `callbacks: ["otel"]` in config.yaml — both are required.
      # otlp_http, so the endpoint carries the full /v1/traces path; the gRPC exporter
      # would want a bare host:port instead.
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://host.docker.internal:4318/v1/traces
      OTEL_SERVICE_NAME: litellm
    extra_hosts:
      # The host, named stably. Bridge gateway IPs move when a network is recreated.
      - "host.docker.internal:host-gateway"
    ports:
      # 127.0.0.1 only. TB's own consumers dial it here; cross-node consumers go through
      # Caddy -> ai.siffreinsigy.me like anything else, so the mesh guard can eventually
      # be fleet-wide. See docs/decisions/2026-07-27-cross-node-calls-use-the-public-edge.md
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - the-sea-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health/liveliness || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Not just LiteLLM's: this is the fleet's Postgres, and Phase 4's pgvector store.
  # The pgvector image from day one so Open-WebUI's vector store needs no migration.
  # No `ports:` on purpose — every consumer is on the-sea-internal, so there is
  # nothing to bind and the bind rule is satisfied by having no host port at all.
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: postgres
    restart: unless-stopped
    # One .env for both services, so this container also sees LITELLM_SALT_KEY and the
    # Scaleway key. Deliberate — a second secrets file to keep in sync is worse than a
    # few unused variables in an environment nothing reads them from.
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
      - the-sea-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:

networks:
  the-sea-internal:
    external: true
