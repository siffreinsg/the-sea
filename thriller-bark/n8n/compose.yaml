services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.4
    container_name: n8n
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_SECURE_COOKIE=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - DB_SQLITE_POOL_SIZE=8
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HOST=n8n.siffreinsigy.me
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.siffreinsigy.me/
      # Traces -> Alloy on the host -> Tempo on GM. host.docker.internal is the stable
      # way to name the host: the bridge gateway IP changes if the network is recreated.
      # OTEL has shipped since n8n 2.19.0, no sidecar needed.
      - N8N_OTEL_ENABLED=true
      - N8N_OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      # The correlation key: injects W3C traceparent into outbound HTTP, so a call from a
      # workflow into LiteLLM lands in the same trace instead of a sibling one.
      - N8N_OTEL_TRACES_INJECT_OUTBOUND=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - n8n-edge
    volumes:
      - n8n-data:/home/node/.n8n
      - n8n-files:/files

volumes:
  n8n-data:
  n8n-files:

networks:
  # Not `edge` — n8n runs user-supplied code and `edge` reaches headscale, authelia,
  # backrest by container name. n8n gets its own network, joined only by Caddy and the
  # actual_api sidecar, so a workflow can't dial anything else on `edge`.
  n8n-edge:
    external: true
