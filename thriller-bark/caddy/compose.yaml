services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2020:2020"   # metrics — scraped by host-mode Alloy over loopback
    extra_hosts:
      # Reaches gm-relay's and komodo's host-bound loopback listeners from the bridge.
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - edge
      - n8n-edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

networks:
  edge:
    external: true
  n8n-edge:
    external: true
