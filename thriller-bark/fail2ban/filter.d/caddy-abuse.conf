# Caddy JSON access log (thriller-bark/caddy/Caddyfile's file output).
# Bans on 4xx floods and known scan paths, not on legitimate single hits.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":40[134].*$
            ^.*"remote_ip":"<HOST>".*"uri":"/(wp-admin|wp-login|\.env|\.git|xmlrpc\.php|phpmyadmin)[^"]*".*$
ignoreregex =
