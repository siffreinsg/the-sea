services:
  actual_server:
    image: actualbudget/actual-server:26.7.0-alpine
    container_name: actual_server
    restart: unless-stopped
    networks:
      - default
      - edge
    volumes:
      - actual-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  actual-data:

networks:
  edge:
    external: true
