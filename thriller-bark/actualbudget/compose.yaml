services:
  actual_server:
    image: actualbudget/actual-server:26.8.1-alpine
    container_name: actual_server
    restart: unless-stopped
    networks:
      - default
      - edge
    volumes:
      - actual-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # HTTP surface over @actual-app/api, the only way to drive a bank sync from n8n
  # (docs/ADR/2026-08-06-n8n-drives-actual-via-http-sidecar.md). Tag mirrors Actual's
  # own version — bump both together, an older api lib fails on every endpoint.
  actual_api:
    image: jhonderson/actual-http-api:26.8.0
    container_name: actual_api
    restart: unless-stopped
    depends_on:
      - actual_server
    env_file: .env
    environment:
      - ACTUAL_SERVER_URL=http://actual_server:5006/
    networks:
      - default
      - n8n-edge
    volumes:
      - actual-api-cache:/data

volumes:
  actual-data:
  # Budget cache the api lib re-downloads at will. The budget of record is actual-data,
  # so this one stays out of backup.sh.
  actual-api-cache:

networks:
  edge:
    external: true
  n8n-edge:
    external: true
