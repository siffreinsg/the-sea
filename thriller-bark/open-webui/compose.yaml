services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2-slim
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - config.env
      - .env
    extra_hosts:
      # For the OTLP endpoint in config.env. Bridge gateway IPs move when a network is
      # recreated, so never write a literal 172.x address.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3020:8080"
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - the-sea-internal

volumes:
  open-webui-data:

networks:
  the-sea-internal:
    external: true
