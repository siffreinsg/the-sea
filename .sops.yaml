# Files matching path_regex are encrypted for the age recipient below.
# The matching private key lives only in ~/.config/sops/age/keys.txt + your password manager.
# Exception: thriller-bark/open-webui/config.env matches this regex but must stay
# PLAINTEXT — it is reviewable-in-a-diff config, not secrets
# (docs/decisions/2026-07-26-open-webui-config-as-code.md). sops only encrypts when you
# run `sops -e` on a file, so never run it on that one.
creation_rules:
  - path_regex: (.*\.env|.*/secrets\..*)$
    age: age1wce7sqneyq58tux6fnpj2e2tsc05j4jqk8h8dguu0jc6eplfrslqqdw7md
