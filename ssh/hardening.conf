# Shared sshd hardening, identical on TB and GM — symlinked from both, one file, one
# source of truth. Per-node bind/port/user goes in <node>/ssh/local.conf instead
# (docs/runbooks/install-fail2ban.md installs both).
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
AuthenticationMethods publickey

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
PermitRootLogin no
UsePAM no

MaxAuthTries 3
MaxSessions 2
ClientAliveInterval 300
ClientAliveCountMax 3
