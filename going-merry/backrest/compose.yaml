services:
  backrest:
    image: garethgeorge/backrest:v1.14.1-alpine
    container_name: backrest
    restart: unless-stopped
    ports:
      - "100.64.0.1:9898:9898"     # GM mesh IP — needs tailscaled up; restart policy retries
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
    volumes:
      - backrest-data:/data
      - backrest-config:/config
      - backrest-cache:/cache
      - ./rclone.conf:/root/.config/rclone/rclone.conf   # rw: protondrive rewrites its own refreshed token in place
      - /var/backups/the-sea:/userdata/backups:ro   # future per-app dumps land here
      - grafana-data:/userdata/grafana:ro
      - cleanuparr-config:/userdata/cleanuparr:ro
      - profilarr-config:/userdata/profilarr:ro
      - karakeep-data:/userdata/karakeep:ro

volumes:
  backrest-data:
  backrest-config:
  backrest-cache:
  grafana-data:
    external: true
    name: observability_grafana-data
  cleanuparr-config:
    external: true
    name: cleanuparr_config
  profilarr-config:
    external: true
    name: profilarr_config
  karakeep-data:
    external: true
    name: karakeep_data
