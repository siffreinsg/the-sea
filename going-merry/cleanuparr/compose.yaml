services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.9.16
    container_name: cleanuparr
    restart: unless-stopped
    environment:
      PORT: 11011
      PUID: 1000
      PGID: 1000
      UMASK: 022
      TZ: Europe/Paris
    ports:
      - "100.64.0.1:11011:11011"
    volumes:
      - config:/config

# No secrets.env: every credential (qBittorrent, arr API keys, Discord webhook,
# the Authelia client secret) is entered in the UI and lives in /config's SQLite.
volumes:
  config:
