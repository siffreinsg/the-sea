services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    container_name: karakeep
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data
      NEXTAUTH_URL: https://karakeep.siffreinsigy.me
      CRAWLER_FULL_PAGE_ARCHIVE: "true"
      OAUTH_WELLKNOWN_URL: https://auth.siffreinsigy.me/.well-known/openid-configuration
      OAUTH_PROVIDER_NAME: Authelia
      DISABLE_PASSWORD_AUTH: "true"
      DISABLE_SIGNUPS: "true"
    ports:
      - "100.64.0.1:3050:3000"
    volumes:
      - data:/data
    depends_on:
      - meilisearch
      - chrome

  chrome:
    image: zenika/alpine-chrome:124
    container_name: karakeep_chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.53.0
    container_name: karakeep_meilisearch
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_NO_ANALYTICS: "true"
      # The index is derived from Karakeep's SQLite, so let tag bumps migrate it in place.
      # If a migration half-fails: drop the meilisearch volume and reindex from Karakeep admin.
      MEILI_UPGRADE_DB: "true"
    volumes:
      - meilisearch:/meili_data

volumes:
  data:
  meilisearch:
