services:
  searxng:
    # Rolling upstream: tags are YYYY.M.D-<githash>, several a day, no semver and no LTS.
    # Pinned anyway, bumped when the engine-reliability alert fires — engines are scrapers
    # of sites that change without warning, so upstream's fix for a dead engine ships in a
    # newer date tag. The alert is the trigger; never move this to latest.
    image: searxng/searxng:2026.7.28-c01178d03
    container_name: searxng
    restart: unless-stopped
    env_file: .env
    # No User in the image config, so upstream runs this as root. It parses attacker-
    # controlled HTML for a living, so it drops to the image's own searxng uid. This also
    # makes the entrypoint's chown and update-ca-certificates branches unreachable, which
    # is why no FORCE_OWNERSHIP is needed. Must stay in sync with the chown in the stack's
    # pre_deploy: the rendered settings.yml is 0600 and would otherwise be unreadable.
    user: "977:977"
    volumes:
      # A directory, not a single file: the entrypoint runs check_directory on it.
      # settings.yml is rendered here by pre_deploy and is gitignored, it holds the
      # open_metrics password.
      - ./config:/etc/searxng:ro
    # No volume. The only thing that would live in /var/cache/searxng is the favicon cache,
    # which is off; the engines cache is hardcoded to /tmp (enginelib/__init__.py:46 builds
    # it with no db_url). Losing it on restart costs one ClearURLs fetch.
    ports:
      - "100.64.0.1:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /healthz, not a search: a search healthcheck fans out to every engine every 30s
      # and earns GM's IP a rate-limit for nothing.
      #
      # The X-Forwarded-For is for the log, not for botdetection (limiter is off). Without
      # it every probe logs `ERROR:searx.botdetection: X-Forwarded-For nor X-Real-IP header
      # is set!`, which is an ERROR line into Loki twice a minute forever. Requests through
      # the Caddy relay carry the header already; only direct ones need this.
      test: ["CMD-SHELL", "wget -q --header='X-Forwarded-For: 127.0.0.1' -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 10s
