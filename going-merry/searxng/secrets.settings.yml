# SearXNG config. Committed sops-encrypted with encrypted_regex '^open_metrics$', so every
# line here stays readable in a diff and only the password is ciphertext. Rendered to
# config/settings.yml by the stack's pre_deploy. Edit with `sops going-merry/searxng/secrets.settings.yml`.
#
# sops reformats YAML on encrypt: blank lines are stripped and indentation normalises.
# That is why sections are separated by comment lines rather than blank ones.
#
# Everything below is a diff against upstream's own searx/settings.yml, not against the
# code defaults — the two differ, and the shipped file is the base that use_default_settings
# merges over. Anything not set here is whatever the pinned image ships.
#
# --- engines -------------------------------------------------------------------------
# Open-WebUI always asks for the `general` category and never names an engine, so only
# general-category engines matter. Upstream ships 347 engines, 85 live, of which exactly 10
# answer a general query: 5 useful, plus currency/dictzone/lingva/mymemory which return
# translations and conversions rather than documents, plus `google cse` which works only by
# riding a stranger's hardcoded CSE id (google_cse.py:42). All of those are dropped.
#
# Five independent web indexes so one block does not blank the results, two encyclopedic
# sources. mojeek and qwant ship `disabled: true`, so keep_only alone would leave them off:
# the engines list below flips them on.
use_default_settings:
    engines:
        keep_only:
            - duckduckgo
            - brave
            - startpage
            - mojeek
            - qwant
            - wikipedia
            - wikidata
engines:
    - name: mojeek
      disabled: false
    - name: qwant
      disabled: false
# --- server ----------------------------------------------------------------------------
server:
    # base_url is deliberately unset. There are two real paths here — the Caddy relay
    # (host.docker.internal:18090, valid only inside a TB container) and 100.64.0.1:8080 for a
    # direct curl — so any fixed value lies about one of them. It only affects absolute links
    # in opensearch/rss output, which nothing consumes.
    #
    # secret_key is not here either: SEARXNG_SECRET from secrets.env overrides it
    # (settings_defaults.py:218). Upstream's file sets the literal "ultrasecretkey" and the
    # entrypoint's sed fallback only fires when settings.yml is absent, which it is not.
    #
    # limiter needs a valkey DB to do anything at all (limiter.py:218) and filters *inbound*
    # requests. Inbound here is one Open-WebUI over a private relay. Off deliberately, and
    # that is the only thing valkey would have been for.
    limiter: false
    public_instance: false
    # Default is "1.0", which means no keep-alive, so Caddy reopens a TCP connection across
    # the mesh for every search.
    http_protocol_version: "1.1"
# --- search ------------------------------------------------------------------------------
search:
    # safe_search and default_lang are NOT set here on purpose: Open-WebUI sends safesearch=1
    # and language=all as explicit query params on every request (searxng.py, retrieval.py:2229),
    # so anything written here would be overridden and would read as a decision that isn't one.
    #
    # Upstream's settings.yml narrows formats to [html] even though the code default is all
    # four. Without json, Open-WebUI gets HTML back and web search fails looking like a
    # parsing bug.
    formats:
        - html
        - json
    suspended_times:
        # Upstream bans an engine for 15 days on a Cloudflare CAPTCHA and 7 on a reCAPTCHA.
        # Those numbers are for public instances with dozens of engines, where losing one is
        # invisible. With 5 web indexes it is 20% of coverage, and the reliability alert tells
        # us when it happens. Cut to a day and half a day; the short backoffs below are left
        # alone because those are the ones doing real protective work.
        cf_SearxEngineCaptcha: 86400
        recaptcha_SearxEngineCaptcha: 43200
# --- outgoing ----------------------------------------------------------------------------
outgoing:
    # Default 3.0s silently drops any engine slower than that, and Open-WebUI puts no timeout
    # of its own on the call (AIOHTTP_CLIENT_TIMEOUT defaults to None, env.py:576). Losing a
    # whole index costs more than the latency, which Firecrawl scraping 5 pages dominates
    # anyway. max_request_timeout caps any per-engine override so nothing can hang.
    request_timeout: 8
    max_request_timeout: 15
# --- plugins -----------------------------------------------------------------------------
# Open-WebUI reads payload["results"] and nothing else, so every plugin that emits *answers*
# is invisible to the only consumer. ahmia_filter only applies to onion engines, which
# keep_only removed.
plugins:
    # Rewrites result URLs before we see them, stripping utm_* and friends: cleaner citations
    # and no cache-splitting when Firecrawl fetches the same page twice. Note it is not a
    # bundled list — tracker_patterns.py:33 fetches ClearURLs rules from clearurls.xyz at
    # init with a 3s timeout, on every restart, and fails soft with a log warning.
    searx.plugins.tracker_url_remover.SXNGPlugin:
        active: true
    # Active because the hostnames: block below exists. The plugin is skipped entirely when
    # that key is absent.
    searx.plugins.hostnames.SXNGPlugin:
        active: true
    searx.plugins.calculator.SXNGPlugin:
        active: false
    searx.plugins.unit_converter.SXNGPlugin:
        active: false
    searx.plugins.self_info.SXNGPlugin:
        active: false
    searx.plugins.hash_plugin.SXNGPlugin:
        active: false
    searx.plugins.time_zone.SXNGPlugin:
        active: false
    searx.plugins.ahmia_filter.SXNGPlugin:
        active: false
    searx.plugins.infinite_scroll.SXNGPlugin:
        active: false
    searx.plugins.oa_doi_rewrite.SXNGPlugin:
        active: false
    searx.plugins.tor_check.SXNGPlugin:
        active: false
# --- hostnames ---------------------------------------------------------------------------
# The criterion for `remove` is scrapeability, not taste. Self-hosted Firecrawl loses
# Fire-engine, so it has no bot-detection handling: a login-walled result is not a bad
# document, it is an empty one that still burns one of 5 slots and one embedding call.
# `low_priority` is for merely-mediocre, which is a ranking opinion and reversible.
# reddit is in none of the lists deliberately — often the only real answer, often
# unscrapeable. Better to see it fail once and measure than to guess.
hostnames:
    remove:
        - (.*\.)?facebook\.com$
        - (.*\.)?instagram\.com$
        - (.*\.)?tiktok\.com$
        - (.*\.)?(x|twitter)\.com$
        - (.*\.)?pinterest(\..*)?$
        - (.*\.)?quora\.com$
        - (.*\.)?scribd\.com$
        - (.*\.)?coursehero\.com$
        - (.*\.)?chegg\.com$
    low_priority:
        - (.*\.)?medium\.com$
        - (.*\.)?w3schools\.com$
        - (.*\.)?geeksforgeeks\.org$
        - (.*\.)?tutorialspoint\.com$
        - (.*\.)?javatpoint\.com$
    high_priority:
        - (.*\.)?wikipedia\.org$
        - (.*\.)?stackoverflow\.com$
        - (.*\.)?github\.com$
        - (.*\.)?developer\.mozilla\.org$
        - (.*\.)?readthedocs\.io$
        - (.*\.)?arxiv\.org$
# --- metrics -----------------------------------------------------------------------------
# enable_metrics already defaults true; open_metrics is what turns the /metrics endpoint on,
# and webapp.py:1160 hard-404s without a password — there is no unauthenticated mode. It has
# no SEARXNG_* env override, unlike secret_key, which is the whole reason this file is
# sops-encrypted rather than plaintext. Scraped by alloy-gm.
