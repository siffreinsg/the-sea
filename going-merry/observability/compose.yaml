services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0-scratch
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
    ports:
      - "100.64.0.1:8428:8428"   # mesh ingest — needs tailscaled up; restart policy retries
    volumes:
      - vm-data:/storage

  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "100.64.0.1:3100:3100"   # mesh ingest — needs tailscaled up; restart policy retries
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:3.0.2   # tag has no `v` prefix — `v3.0.2` does not exist
    container_name: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      # OTLP gRPC only. 3200 stays unpublished — Grafana reaches it over this network.
      - "100.64.0.1:4317:4317"   # mesh ingest — needs tailscaled up; restart policy retries
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.1.3-slim
    container_name: grafana
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SERVER_ROOT_URL: https://grafana.siffreinsigy.me
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "100.64.0.1:3000:3000"   # needs tailscaled up; restart policy retries
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./dashboards:/etc/grafana/dashboards:ro

volumes:
  vm-data:
  loki-data:
  tempo-data:
  grafana-data:
