apiVersion: 1
groups:
    - orgId: 1
      name: infra
      folder: Alerting
      interval: 1m
      rules:
        - uid: eft00rnexqq68d
          title: Node down
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: up{job="integrations/unix"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 5m
          annotations:
            summary: '{{ $labels.node }} node exporter is unreachable'
          labels:
            severity: critical
          isPaused: false
        - uid: dft00rnmwx1xcb
          title: Root disk space low
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 10m
          annotations:
            summary: '{{ $labels.node }} root filesystem below 10% free'
          labels:
            severity: critical
          isPaused: false
        - uid: aft0111ypbeo0e
          title: High memory usage
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 10m
          annotations:
            summary: '{{ $labels.node }} available memory below 10%'
          labels:
            severity: warning
          isPaused: false
        - uid: fft01129bdvk0e
          title: Caddy config reload failed
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: caddy_config_last_reload_successful
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          # Alerting, not OK: caddy_config_last_reload_successful exists whenever Caddy is
          # up and Alloy is scraping it. No data means Caddy is down or its admin endpoint
          # stopped answering — the one thing this rule must not swallow.
          noDataState: Alerting
          execErrState: Alerting
          for: 5m
          annotations:
            summary: Caddy on {{ $labels.node }} failed its last config reload or stopped reporting
          labels:
            severity: critical
          isPaused: false
        # --- AI platform -------------------------------------------------------------
        # Both read LiteLLM's own /metrics, scraped by TB's Alloy. Neither series exists
        # before the first request or the first failure, so noDataState is OK — an idle
        # gateway is not an incident.
        - uid: aft0270aispnd0
          title: LLM spend above threshold
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # EUR spent in the last 24h, all consumers and models.
                expr: sum(increase(litellm_spend_metric_total[24h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            # EUR/day. Current usage is fractions of a cent, so this fires
                            # on a runaway loop or a leaked key, not on normal chatting.
                            # Raise it deliberately if real usage ever approaches it.
                            - 2
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: OK
          # 15m, not 5m: the query is a 24h window, so a spike stays true for a while and
          # a shorter `for` buys nothing.
          for: 15m
          annotations:
            summary: LLM spend over the last 24h exceeded EUR 2
          labels:
            severity: warning
          isPaused: false
        - uid: bft0270jsperr0
          title: LLM provider errors
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # Failures per second at the provider, including 429s. `or vector(0)`
                # keeps the rule evaluable before the metric first appears.
                expr: sum(rate(litellm_proxy_failed_requests_metric_total[15m])) or vector(0)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            # ~1 failure per 15m window. A single transient 429 is noise;
                            # a sustained rate means the chat is actually broken.
                            - 0.0011
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 10m
          annotations:
            summary: LiteLLM is seeing sustained provider failures — check the AI platform dashboard
          labels:
            severity: warning
          isPaused: false
        - uid: cft0290searxng1
          title: SearXNG engine failing
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 1800
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # Reliability is a percentage over recent requests. The request_count guard
                # is there because the percentage is meaningless on a tiny sample:
                # get_reliabilities computes `100 - sum(error percentages)`, so a single
                # transient error on an engine with two requests reads as 0% and fires.
                #
                # It is NOT protecting against zero-request engines — those emit no row at
                # all. openmetrics() builds data_info from engine_stats['time'], and
                # get_engines_stats `continue`s on sent_count == 0, so an idle engine is
                # absent rather than 0. The `or 0` coercion in the exporter is unreachable.
                #
                # The `< 50` comparison lives in B, not here. A bare `<` in PromQL filters
                # and keeps the *original* value, so `reliability < 50` passes 0 through to
                # a `> 0` threshold and the rule goes silent on a fully banned engine —
                # exactly the case the summary describes. A carries the raw percentage.
                expr: searxng_engines_reliability_total and searxng_engines_request_count_total > 10
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 1800
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        # Percentage, 0-100. Verify that against a real /metrics dump
                        # before trusting it: a 0-1 scale would match every engine forever.
                        params:
                            - 50
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 30m
          annotations:
            summary: 'SearXNG engine {{ $labels.engine_name }} is failing most requests — check for a CAPTCHA ban, then whether a newer image already fixes it'
          labels:
            severity: warning
          isPaused: false
        - uid: cft0290searxng2
          title: SearXNG lost an engine
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # keep_only filters upstream's engine list by name and says nothing when a
                # name disappears, so an upgrade that renames or drops an engine degrades
                # silently.
                #
                # get_engines_stats `continue`s on sent_count == 0, so an engine only
                # appears here once it has served a request since the process started, and
                # a restarted SearXNG exports nothing at all. Counting alone would fire
                # after every restart. Every general query hits all 7, so the guard is the
                # busiest engine: if one has 20 requests and fewer than 7 are reporting,
                # one is genuinely gone. Update the 7 if the allow-list changes.
                expr: count(searxng_engines_reliability_total) < 7 and on() (max(searxng_engines_request_count_total) > 20)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        # The comparison is inside the expression, so A is either empty or
                        # the engine count. Any sample at all means the rule tripped.
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 15m
          annotations:
            summary: SearXNG is running fewer than 7 engines — an upgrade probably renamed or removed one from the keep_only list
          labels:
            severity: warning
          # PAUSED, and not silently. wikidata has been failing init since the first deploy
          # (2026-07-31): query.wikidata.org 403s the SPARQL call it makes at worker boot,
          # and a failed init is never retried — register_processor drops the engine for the
          # process lifetime. So the count is 6 and this rule would fire forever and get
          # muted, which is the failure mode its own threshold was designed to avoid.
          #
          # Unpause when wikidata inits cleanly, or drop it from keep_only and retune to 6.
          # Tracked in docs/TODO.md. Leaving it paused is a decision with an owner; a muted
          # alert is not.
          isPaused: true
