apiVersion: 1
groups:
    - orgId: 1
      name: infra
      folder: Alerting
      interval: 1m
      rules:
        - uid: eft00rnexqq68d
          title: Node down
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: up{job="integrations/unix"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 5m
          annotations:
            summary: '{{ $labels.node }} node exporter is unreachable'
          labels:
            severity: critical
          isPaused: false
        - uid: dft00rnmwx1xcb
          title: Root disk space low
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 10m
          annotations:
            summary: '{{ $labels.node }} root filesystem below 10% free'
          labels:
            severity: critical
          isPaused: false
        - uid: aft0111ypbeo0e
          title: High memory usage
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 10m
          annotations:
            summary: '{{ $labels.node }} available memory below 10%'
          labels:
            severity: warning
          isPaused: false
        - uid: fft01129bdvk0e
          title: Caddy config reload failed
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: caddy_config_last_reload_successful
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          # Alerting, not OK: caddy_config_last_reload_successful exists whenever Caddy is
          # up and Alloy is scraping it. No data means Caddy is down or its admin endpoint
          # stopped answering — the one thing this rule must not swallow.
          noDataState: Alerting
          execErrState: Alerting
          for: 5m
          annotations:
            summary: Caddy on {{ $labels.node }} failed its last config reload or stopped reporting
          labels:
            severity: critical
          isPaused: false
        # --- AI platform -------------------------------------------------------------
        # Both read LiteLLM's own /metrics, scraped by TB's Alloy. Neither series exists
        # before the first request or the first failure, so noDataState is OK — an idle
        # gateway is not an incident.
        - uid: aft0270aispnd0
          title: LLM spend above threshold
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # EUR spent in the last 24h, all consumers and models.
                expr: sum(increase(litellm_spend_metric_total[24h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            # EUR/day. Current usage is fractions of a cent, so this fires
                            # on a runaway loop or a leaked key, not on normal chatting.
                            # Raise it deliberately if real usage ever approaches it.
                            - 2
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: OK
          # 15m, not 5m: the query is a 24h window, so a spike stays true for a while and
          # a shorter `for` buys nothing.
          for: 15m
          annotations:
            summary: LLM spend over the last 24h exceeded EUR 2
          labels:
            severity: warning
          isPaused: false
        - uid: bft0270jsperr0
          title: LLM provider errors
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # Failures per second at the provider, including 429s. `or vector(0)`
                # keeps the rule evaluable before the metric first appears.
                expr: sum(rate(litellm_proxy_failed_requests_metric_total[15m])) or vector(0)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            # ~1 failure per 15m window. A single transient 429 is noise;
                            # a sustained rate means the chat is actually broken.
                            - 0.0011
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: OK
          for: 10m
          annotations:
            summary: LiteLLM is seeing sustained provider failures — check the AI platform dashboard
          labels:
            severity: warning
          isPaused: false
        - uid: eft0400headscaledown1
          title: Headscale down
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                expr: up{job="headscale"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          # TB staying up doesn't mean the mesh is up: Node down only watches
          # node_exporter, and Komodo Periphery + Alloy's mesh pushes both depend on
          # headscale specifically.
          noDataState: Alerting
          execErrState: Alerting
          for: 5m
          annotations:
            summary: Headscale on {{ $labels.node }} is down or stopped reporting — the mesh is degraded
          labels:
            severity: critical
          isPaused: false
        - uid: dft0330tikadown1
          title: Tika down
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # Tika has no /metrics and no docker healthcheck, so its own failure is
                # invisible — the only signal cadvisor has is whether the container is
                # still there at all. container_last_seen is the label already used by
                # dashboards/containers.json for this.
                expr: time() - container_last_seen{name="tika"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 120
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 5m
          annotations:
            summary: Tika container has not reported in over 2 minutes — Open-WebUI's RAG uploads are failing silently while this is down
          labels:
            severity: warning
          isPaused: false
        - uid: aft0802syncthingstuck1
          title: Syncthing folder stuck out of sync
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 21600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                # needBytes per folder. A peer offline (the phone, most of the time) is
                # normal and doesn't block this — need only grows once some other peer
                # has pulled the change and reported back, so a lone offline device
                # never trips it on its own.
                expr: max(syncthing_model_folder_summary{scope="need",type="bytes"}) by (folder)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 21600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: OK
          execErrState: OK
          # 6h: long enough that a device catching up overnight isn't a false alarm,
          # short enough that a genuinely stuck folder (conflict, disk full, crashed
          # container) still pages the same day.
          for: 6h
          annotations:
            summary: '{{ $labels.folder }} has had pending bytes to sync for over 6 hours — check the Syncthing GUI for errors or a stalled peer'
          labels:
            severity: warning
          isPaused: false
