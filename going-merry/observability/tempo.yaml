# Monolithic Tempo — single binary, local filesystem, no object store. Same shape as
# loki.yaml next door: one node, one replica, retention-capped, never backed up.
#
# Only the OTLP gRPC receiver is published (mesh-scoped, see compose.yaml). Grafana
# queries over the compose network at http://tempo:3200, so 3200 stays unpublished.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # 0.0.0.0 inside the container; the host-side bind is mesh-only.
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Traces are only queryable once a block is cut. The default is 30m, which means a
  # trace you just produced is invisible for half an hour — useless while wiring this up.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h   # 14d. Traces are bulkier than logs; Loki keeps 30d.

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# ponytail: no metrics_generator. Span metrics and service graphs need a Prometheus
# remote-write target and roughly double the write path; add it if the Phase 5 dashboards
# actually want RED metrics per service.
