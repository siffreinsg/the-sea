apiVersion: 1

# Loki predates its explicit uid below. Grafana matches an existing datasource by uid, not
# by name, so provisioning a new uid onto it fails with "data source not found" — and that
# failure kills the whole provisioning module, so Grafana refuses to start. Deletes run
# before inserts, so this recreates it with the right uid. Kept permanently: it is
# idempotent, and a fresh clone hits the same path in reverse.
# VictoriaMetrics is NOT listed here — deleting it would orphan every alert rule.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    # No explicit uid: Grafana generated P4169E866C3094E38 and every alert rule in
    # provisioning/alerting/rules.yaml references it. Setting one here breaks them all.

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki   # nothing referenced Loki by uid before this, so pinning it is free
    jsonData:
      derivedFields:
        # Logs -> Trace. Verified 2026-07-27 against Open-WebUI, which logs
        # `trace_id": "<32 hex>`. **LiteLLM logs no trace id at all**, so this link is
        # Open-WebUI-only — a LiteLLM log line will never show the button, and that is
        # the app's behaviour, not a broken regex.
        - name: TraceID
          matcherRegex: '[tT]race[_-]?[iI][dD]"?\s*[=:]\s*"?([a-f0-9]{32})'
          url: '${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      # Trace -> Logs. The shifts widen the log window around the span; without them a
      # span at the edge of a second finds nothing.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
