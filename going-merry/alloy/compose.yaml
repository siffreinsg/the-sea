services:
  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    network_mode: host   # scrapes 127.0.0.1 targets; UI pinned to loopback below
    restart: unless-stopped
    # SEARXNG_OPEN_METRICS_PASSWORD, read by sys.env in config.alloy. SearXNG's /metrics
    # requires HTTP basic auth and the password has no env override on its side, so this is
    # the second copy of it — the other is going-merry/searxng/secrets.settings.yml.
    env_file: .env
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # cadvisor hardcodes these paths (no path-override args) — separate from the /host/* mounts above
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro

volumes:
  alloy-data:
